<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb4f0"/><stop offset="0.55" stop-color="#ffd9e6"/><stop offset="1" stop-color="#ffe9c9"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d7b4"/><stop offset="1" stop-color="#cdb487"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="380" cy="150" r="46" fill="#fff6d8" opacity="0.9"/>
  <path d="M0 300 Q130 250 256 285 T512 280 V512 H0Z" fill="#7cc35b"/>
  <path d="M0 330 Q140 300 256 320 T512 318 V512 H0Z" fill="#5fae47"/>
  <!-- road -->
  <path d="M236 290 L276 290 L420 512 L92 512 Z" fill="url(#road)"/>
  <path d="M236 290 L228 290 L70 512 L92 512 Z" fill="#f3efe6"/>
  <path d="M276 290 L284 290 L442 512 L420 512 Z" fill="#f3efe6"/>
  <!-- trees: left -->
  <g fill="#3f8f3a"><path d="M60 330 L95 230 L130 330Z"/><path d="M150 305 L172 240 L194 305Z"/></g>
  <g fill="#f5a3c3"><circle cx="30" cy="250" r="40"/><circle cx="200" cy="262" r="22"/></g>
  <!-- trees: right -->
  <g fill="#e8892f"><circle cx="470" cy="245" r="44"/><circle cx="330" cy="262" r="20"/></g>
  <g fill="#2f7d4e"><path d="M380 335 L415 225 L450 335Z"/></g>
  <rect x="26" y="285" width="8" height="40" fill="#7a5235"/><rect x="466" y="285" width="8" height="45" fill="#7a5235"/>
  <!-- panda from behind -->
  <g transform="translate(256 400)">
    <ellipse cx="0" cy="98" rx="92" ry="14" fill="#000" opacity="0.18"/>
    <!-- legs -->
    <rect x="-62" y="40" width="46" height="62" rx="22" fill="#1f1f24"/>
    <rect x="18" y="30" width="46" height="62" rx="22" fill="#1f1f24" transform="rotate(-8 41 60)"/>
    <!-- body -->
    <ellipse cx="0" cy="0" rx="82" ry="78" fill="#f7f5f0"/>
    <!-- shoulder band -->
    <path d="M-80 -34 Q0 -76 80 -34 L82 8 Q0 -30 -82 8Z" fill="#1f1f24"/>
    <!-- arms -->
    <rect x="-104" y="-26" width="38" height="78" rx="19" fill="#1f1f24" transform="rotate(18 -85 -20)"/>
    <rect x="66" y="-26" width="38" height="78" rx="19" fill="#1f1f24" transform="rotate(-24 85 -20)"/>
    <!-- tail -->
    <circle cx="0" cy="48" r="13" fill="#ffffff" stroke="#e5e1d8" stroke-width="2"/>
    <!-- head (back) -->
    <circle cx="0" cy="-88" r="60" fill="#f7f5f0"/>
    <circle cx="-46" cy="-136" r="22" fill="#1f1f24"/>
    <circle cx="46" cy="-136" r="22" fill="#1f1f24"/>
  </g>
</svg>
